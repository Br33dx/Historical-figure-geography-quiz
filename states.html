const U=C.filter(c=>!c.sp);
const CN={N:"Northeast",M:"Midwest",S:"South",W:"West"},rad=Math.PI/180;
const psi=l=>Math.log(Math.tan(Math.PI/4+l*rad/2));
// Direction as seen on a standard world map centred on 0 degrees (no wrapping over the date line), clockwise from north
function brg(a,b){const d=b.lo-a.lo;return(Math.atan2(d*rad,psi(b.la)-psi(a.la))/rad+360)%360}

const ad=(x,y)=>{const d=Math.abs(x-y)%360;return d>180?360-d:d};
const shuf=a=>a.slice().sort(()=>Math.random()-.5),rnd=a=>a[Math.floor(Math.random()*a.length)];
// 1 close neighbour, 2 somewhat close, 2 far (well-known) + 1 extra far arrow for the hint
function build(M){
const o=U.filter(c=>c!==M).map(c=>({c,d:dist(M,c),b:brg(M,c)})).filter(x=>x.d>=150).sort((p,q)=>p.d-q.d);
const m=o.filter(x=>Math.abs(x.c.lo-M.lo)<=180),kn=o.filter(x=>x.c.k),fa=kn.filter(x=>x.d>3500),far=fa.length>=6?fa:kn.slice(-20),tw=U.filter(c=>c!==M&&dist(M,c)<150);

// each flag sits on the outer ring, or on a slightly inner ring when the outer spot is taken
const add=(p,mm)=>{p=shuf(p.filter(x=>!L.includes(x)&&L.every(y=>ad(x.b,y.b)>=mm)));for(const x of p)for(const r of[1,.74]){if(pos(x.b,r).r<150)continue;if(L.every(y=>!clash(x.b,r,y.b,y.t))){x.t=r;L.push(x);return true}}return false};
const plan=[[m.slice(0,4),sp],...Array(k===5?2:1).fill([m.slice(4,30),sp]),...Array(k===3?1:2).fill([far,sp]),[far,sp-6]];
if(!plan.every(([p,a])=>add(p,a)))continue;
const sel=L.slice(0,-1);
if(!U.some(c=>c!==M&&!tw.includes(c)&&!sel.some(x=>x.c===c)&&sel.every(x=>ad(brg(c,x.c),x.b)<tol)))return{r:L,tw}}
return null}
//PURE-END
const CATS=[["All 50 states + D.C. (hard)",c=>1,1],["Easy: well-known states",c=>c.k,1],["Northeast",c=>c.c==="N",0],["Midwest",c=>c.c==="M",0],["South",c=>c.c==="S",0],["West",c=>c.c==="W",0]];
const SP={};
function special(m){const z=C.find(c=>c.n===SP[m.n]);let L;for(let t=0;t<300;t++){const o=Math.random()*360;
L=Array.from({length:6},(_,k)=>({c:z,b:(o+k*60+Math.random()*30-15+360)%360,t:1}));
if(L.every((x,i)=>L.every((y,j)=>j<=i||(ad(x.b,y.b)>=30&&!clash(x.b,1,y.b,1)))))break}return{m,r:L,tw:[],sp:1}}
const SEG=[[20,750],[15,500],[10,250],[5,100],[2,0]];
const sp=t=>{let v=1000,s=t-2;if(s<=0)return 1000;for(const[r,f]of SEG){const d=(v-f)/r;if(s<=d)return Math.floor(v-r*s);s-=d;v=f}return 0};
function $(id){return document.getElementById(id)}
const q=$("q"),msg=$("msg"),sg=$("sg");
$("cat").innerHTML=CATS.map((c,k)=>`<option value="${k}">${c[0]} (${C.filter(c[1]).length})</option>`).join("");
const N=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const FL={};
const img=i=>FL[i]?`<img alt="${i.toUpperCase()}" src="${FL[i]}">`:"";
let G,i,cur,t0,state,hu=0,wrong=0,total,res,pool=C,cn="",hs=["c","x"],ex=false,timer,list=[],sel=-1;
const cgv=()=>Math.max(0,1000-250*hu-50*wrong),el=()=>(performance.now()-t0)/1000;
function show(){const n=cur.r.length-1+(ex?1:0);let sv="",fl="";
cur.r.slice(0,n).forEach(x=>{const p=pos(x.b,x.t);
sv+=`<line x1="${300+62*p.s}" y1="${220-62*p.c}" x2="${300+(p.r-62)*p.s}" y2="${220-(p.r-62)*p.c}" stroke="var(--fg)" stroke-width="3" marker-end="url(#ah)"/>`;
fl+=`<div class="fl" style="left:${p.x/6}%;top:${p.y/4.4}%">${img(x.c.i)}<span>${x.c.n}</span></div>`});
$("sv").innerHTML=`<defs><marker id="ah" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto"><path d="M0,0L6,3L0,6z" fill="var(--fg)"/></marker></defs><circle cx="300" cy="220" r="58" fill="var(--card)" stroke="var(--ln)" stroke-width="2"/>`+sv;$("fl").innerHTML=fl}
function stats(){$("rd").textContent=`State ${i+1} / 5 · ${cn}`;$("tot").textContent=`Total: ${total.toLocaleString("en")} / 10,000`}
function hb(){$("hint").textContent=`Hint (−250) · ${hs.length-hu} left`}
function reset(){const c=CATS[+$("cat").value];cn=c[0];pool=C.filter(c[1]);hs=c[2]?["c","x"]:["x"];$("end").hidden=true;$("play").hidden=false;total=0;res=[];i=-1;G=[];
for(const m of shuf(pool.filter(c=>!c.sp))){const r=build(m);if(r)G.push({m,r:r.r,tw:r.tw});if(G.length===5)break}
const sc=pool.filter(c=>SP[c.n]);if(sc.length&&Math.random()<.05)G[Math.floor(Math.random()*5)]=special(rnd(sc))}
function init(){reset();state="idle";$("st").hidden=false;$("fl").innerHTML="";$("sv").innerHTML="";$("ct").innerHTML="State<br>?";

$("hint").disabled=$("give").disabled=q.disabled=$("go").disabled=true;stats()}
function next(){i++;if(i>4)return finish();cur=G[i];hu=0;wrong=0;ex=false;state="play";$("st").hidden=true;q.value="";sg.hidden=true;$("hints").textContent="";hb();
$("ct").innerHTML="State<br>?";msg.textContent="Which state is in the middle?";$("nx").hidden=true;q.disabled=$("go").disabled=$("hint").disabled=$("give").disabled=false;
$("cg").textContent=1000;$("sp").textContent=1000;show();t0=performance.now();clearInterval(timer);timer=setInterval(tick,10);stats();if(!matchMedia("(pointer:coarse)").matches)q.focus()}

function nmFit(n){const lw=Math.max(...n.split(" ").map(w=>w.length));let k=Math.min(1,7.5/lw);if(n.length>14)k*=.85;k=Math.max(k,.5);return `<span style="font-size:${k.toFixed(2)}em;display:block;overflow-wrap:anywhere">${n}</span>`}

$("nx").hidden=false;$("nx").textContent=i<4?"Next":"See results";$("hint").disabled=$("give").disabled=true;stats()}
function guess(){sg.hidden=true;if(state!=="play")return;const m=pool.find(p=>N(p.n)===N(q.value));

if(m!==cur.m&&!cur.tw.includes(m)){wrong++;q.value="";$("cg").textContent=cgv();msg.textContent="✗ Not "+m.n+". −50 points (correct guess now worth "+cgv()+")";return}
const s=Math.floor(sp(el())),b=cgv();$("sp").textContent=s;fin(b+s,`✓ Correct! ${m!==cur.m?m.n+" counts too (arrows were drawn from "+cur.m.n+"): ":cur.m.n+": "}${b} + ${s} speed = ${b+s} points`)}
function finish(){$("play").hidden=true;$("end").hidden=false;
$("end").innerHTML=`<div class="big">${total.toLocaleString("en")} / 10,000</div><table>${res.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table><div class="row"><button id="again">Play again</button><button id="shr" class="s">Share my score</button></div>`;$("again").onclick=init;$("shr").onclick=()=>shareScore("Which US State?")}
function shareScore(game){const t="Mapzino · "+game+": "+total.toLocaleString("en")+" / 10,000. Can you beat me? https://mapzino.com";
if(navigator.share){navigator.share({text:t}).catch(()=>{})}else{(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{$("shr").textContent="Copied!"},()=>{prompt("Copy your score:",t)})}}

$("hint").onclick=()=>{if(state!=="play"||hu>=hs.length)return;const h=hs[hu++];

const FB_MAIL="feedback@mapzino.com";
function fbOpen(game,ctx){const body="What happened, or your idea:\n\n\n\n---\nPlease keep the lines below, they help me find the problem.\nGame: "+game+"\n"+ctx+"\nBrowser: "+navigator.userAgent;

$("fb2").onclick=e=>{e.preventDefault();$("fb").onclick(e)};$("fb").onclick=e=>{e.preventDefault();fbOpen("Which US State?","Mystery state: "+(cur?cur.m.n:"none yet")+"\nArrows shown: "+(cur?cur.r.slice(0,-1).map(x=>x.c.n+" "+Math.round(x.b)+"deg").join(", "):"-")+"\nList: "+cn)};
function sug(){const v=N(q.value);sel=-1;if(!v){sg.hidden=true;return}const sc=p=>N(p.n).split(" ").some(w=>w.startsWith(v))?0:1;
list=pool.filter(p=>N(p.n).includes(v)).sort((a,b)=>sc(a)-sc(b)||a.n.localeCompare(b.n)).slice(0,8);
sg.innerHTML=list.map((p,k)=>`<div data-k="${k}">${p.n}</div>`).join("");sg.hidden=!list.length}

else if(e.key==="ArrowUp"&&o){e.preventDefault();sel=(sel+list.length-1)%list.length;hl()}

const TH=[["auto","Auto (system)"],["light","Light"],["dark","Dark"],["parchment","Parchment"],["rose","Rose"],["forest","Forest"],["sunset","Sunset"],["neon","Neon"],["mono","Mono"]];
$("theme").innerHTML=TH.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join("");
function setTh(v){if(v==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.dataset.theme=v;$("theme").value=v}
$("theme").onchange=e=>{setTh(e.target.value);try{localStorage.setItem("th",e.target.value)}catch(x){}};
