<body><main>
<div class="top"><div><a class="back" href="index.html">← All quizzes</a><h1>📅 Daily challenge</h1></div><select id="theme" aria-label="Color scheme"></select></div>
<p>One new set of 5 puzzles per category every day, the same for everyone. You get one try per category. Finish, add your nickname and see where you land in today's Top 10. New puzzles at 00:00 UTC (<span id="cd"></span> from now).</p>
<div class="cards" id="cards"></div>
<h2 style="margin:26px 0 0;font-size:1.25rem">Today's standings</h2>
<div class="boards" id="boards"></div>
<p class="ft"><a href="privacy.html">Privacy</a> · © Mapzino</p>
</main>
<script>
function $(id){return document.getElementById(id)}
$("cards").innerHTML=MZ.GAMES.map(g=>{const r=MZ.load(g[0]);return`<a class="card" href="${g[0]}.html?daily=1"><div class="dc"><h2>${g[2]} ${g[1]}</h2><span class="ck">${r?"✅ "+r.t.toLocaleString("en"):"Play"}</span></div><p>${r?MZ.squares(r.r):"5 puzzles, same for everyone today."}</p></a>`}).join("");
$("boards").innerHTML=MZ.GAMES.map(g=>`<div class="box"><h3>${g[2]} ${g[1]}</h3><div id="b_${g[0]}"></div></div>`).join("");
let nick=null;try{nick=localStorage.getItem("nick")}catch(e){}
MZ.GAMES.forEach(g=>MZ.board($("b_"+g[0]),g[0],nick));
function cd(){const n=new Date(),t=new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1)),m=Math.floor((t-n)/60000);$("cd").textContent=Math.floor(m/60)+" h "+m%60+" min"}cd();setInterval(cd,30000);
const TH=[["auto","Auto (system)"],["light","Light"],["dark","Dark"],["parchment","Parchment"],["rose","Rose"],["forest","Forest"],["sunset","Sunset"],["neon","Neon"],["mono","Mono"]];
$("theme").innerHTML=TH.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join("");
function setTh(v){if(v==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.dataset.theme=v;$("theme").value=v}
$("theme").onchange=e=>{setTh(e.target.value);try{localStorage.setItem("th",e.target.value)}catch(x){}};
try{const v=localStorage.getItem("th");if(v&&TH.some(t=>t[0]===v))setTh(v)}catch(x){}
</script></body></html>
