["1900s (born 1900+)",p=>p.by>=1900],["1800s (born 1800-1899)",p=>p.by>=1800&&p.by<1900],["1500-1799 (born)",p=>p.by>=1500&&p.by<1800],["Before 1500 (born)",p=>p.by<1500],
["Artists",p=>"VLMA".includes(p.c)],["Writers",p=>p.c==="L"],["Music & movies",p=>p.c==="M"||p.c==="A"],["War figures",p=>WAR.has(p.n)],["Scientists & thinkers",p=>p.c==="S"],
["Died before 40",p=>p.dy-p.by<40],["Explorers & travelers",p=>p.c==="E"],["Sportsmen",p=>p.c==="X"]];
$("cat").innerHTML=CATS.map((c,k)=>`<option value="${k}">${c[0]} (${D.filter(c[1]).length})</option>`).join("");

// Real country shapes: decode the TopoJSON bundled inside Datamaps (no extra topojson library needed).
function topoD(t){const tr=t.transform,k=tr?tr.scale:[1,1],o=tr?tr.translate:[0,0];
const A=t.arcs.map(a=>{let x=0,y=0;return a.map(p=>{if(tr){x+=p[0];y+=p[1]}else{x=p[0];y=p[1]}return[+(x*k[0]+o[0]+180).toFixed(2),+(90-(y*k[1]+o[1])).toFixed(2)]})});
const ring=r=>{let pts=[];r.forEach(i=>{const a=i<0?A[~i].slice().reverse():A[i];pts=pts.concat(pts.length?a.slice(1):a)});let off=0;pts=pts.map((p,j)=>{if(j){const d=p[0]-pts[j-1][0];if(d>180)off-=360;else if(d<-180)off+=360}return[+(p[0]+off).toFixed(2),p[1]]});return"M"+pts.map(p=>p.join(",")).join("L")+"Z"};
const poly=p=>p.map(ring).join("");
return Object.values(t.objects)[0].geometries.filter(g=>g.id!=="ATA").map(g=>g.type==="Polygon"?poly(g.arcs):g.type==="MultiPolygon"?g.arcs.map(poly).join(""):"").join("")}
const L=["-168,66 -162,70 -150,71 -125,70 -95,72 -82,69 -62,60 -56,52 -66,45 -70,42 -76,35 -81,30 -80,25 -84,30 -90,29 -97,26 -97,20 -88,16 -83,10 -77,8 -80,7 -86,11 -92,14 -105,20 -110,24 -114,31 -117,32 -124,40 -124,48 -130,55 -140,60 -150,60 -158,57 -165,60",
"-77,8 -72,12 -62,10 -52,5 -50,0 -35,-5 -39,-14 -41,-22 -48,-26 -58,-35 -65,-41 -68,-52 -72,-54 -74,-45 -71,-30 -70,-18 -76,-14 -81,-5 -80,0",
"-55,60 -45,60 -20,70 -20,82 -60,82 -72,78 -58,70",
"-9,37 -9,43 -2,44 -5,48 2,51 8,54 8,57 10,57 5,59 5,62 15,69 25,71 40,68 44,68 60,69 70,73 100,77 112,74 140,72 160,70 180,69 180,65 165,60 156,51 143,59 137,54 141,48 132,43 129,35 126,35 125,38 121,40 118,38 122,37 122,31 120,26 110,21 108,17 106,10 103,10 100,13 100,7 103,1 98,8 98,16 94,17 92,22 87,21 80,15 78,8 73,16 72,21 67,25 57,25 56,27 50,30 48,29 51,25 56,24 59,22 55,17 44,13 39,21 35,28 34,31 36,36 27,37 26,40 24,38 21,37 19,42 13,45 18,40 16,38 12,42 8,44 3,43 0,39 -5,36",
"-17,21 -10,30 -6,36 10,37 11,33 20,31 32,31 35,28 43,12 51,12 40,-3 40,-15 35,-24 32,-29 20,-35 18,-32 12,-17 14,-10 9,-1 9,4 -8,4 -17,14",
"114,-22 122,-18 130,-12 136,-12 142,-11 146,-19 153,-26 150,-37 141,-38 135,-35 131,-31 115,-34",
"-5,50 1,51 2,53 -2,56 -3,58 -6,58 -5,55 -3,54 -5,52","130,31 135,34 140,36 142,40 141,45 139,40 135,35 131,34",
"44,-25 47,-25 50,-15 49,-12 44,-17","95,5 106,-6 104,-6 98,0","109,1 117,7 119,1 116,-4 110,-3","131,-1 141,-3 150,-10 141,-9 132,-3",
"172,-35 178,-38 174,-42 168,-47 167,-45","-24,64 -14,64 -14,66 -22,66","-85,22 -74,20 -78,22","-180,-90 180,-90 180,-72 -180,-72"];
const P=s=>s.split(" ").map(p=>{const[a,b]=p.split(",");return(+a+180)+","+(90-b)}).join(" ");
let land="";
try{const d=topoD(Datamap.prototype.worldTopo);if(d.length>2000)land=`<path id="LD" d="${d}" fill="var(--land)" stroke="var(--ln)" stroke-width=".18" stroke-linejoin="round"/><use href="#LD" x="-360"/><use href="#LD" x="360"/>`}catch(e){}
if(!land)land=L.map(s=>`<polygon points="${P(s)}" fill="var(--land)" stroke="var(--ln)" stroke-width=".4"/>`).join("");
const base=`<rect width="360" height="150" fill="var(--sea)"/>`+land;

function lab(x,y,t,c,up){const sc=($("map").clientWidth||360)/360,fs=Math.max(4.2,12.5/sc),w=t.length*fs*.58+fs*1.1,h=fs*1.6,gap=fs*1.2;const rx=Math.min(Math.max(x-w/2,1),359-w);let ry=up?y-h-gap:y+gap;ry=Math.min(Math.max(ry,1),149-h);
return `<line x1="${x}" y1="${y}" x2="${rx+w/2}" y2="${up?ry+h:ry}" stroke="${c}" stroke-width="${Math.max(.6,1.3/sc).toFixed(2)}"/><rect x="${rx}" y="${ry}" width="${w}" height="${h}" rx="${(fs*.25).toFixed(2)}" fill="${c}"/><text x="${rx+w/2}" y="${ry+h*.71}" font-size="${fs.toFixed(2)}" fill="#fff" text-anchor="middle" font-weight="700">${t}</text>`}
function draw(p){const bx=p.blo+180,by=90-p.bla,dx=p.dlo+180,dy=90-p.dla,bUp=by<=dy;
$("map").innerHTML=base+`<line x1="${bx}" y1="${by}" x2="${dx}" y2="${dy}" stroke="#888" stroke-width=".5" stroke-dasharray="2 1.5"/>`
+lab(bx,by,p.b,"#16a34a",bUp)+lab(dx,dy,p.d,"#dc2626",!bUp)
+`<circle cx="${bx}" cy="${by}" r="${Math.max(1.6,3/(($("map").clientWidth||360)/360)).toFixed(2)}" fill="#16a34a" stroke="#fff" stroke-width=".7"/><circle cx="${dx}" cy="${dy}" r="${Math.max(1.6,3/(($("map").clientWidth||360)/360)).toFixed(2)}" fill="#dc2626" stroke="#fff" stroke-width=".7"/>`}

// Speed bonus: stays at 1000 for the first 5 seconds after the dates and places appear, then drops in tiers (1 point at a time).
const SEG=[[20,750],[15,500],[10,250],[5,100],[2,0]];
const sp=t=>{let v=1000,s=t-GRACE;if(s<=0)return 1000;for(const[r,f]of SEG){const d=(v-f)/r;if(s<=d)return Math.floor(v-r*s);s-=d;v=f}return 0};
function $(id){return document.getElementById(id)}
const q=$("q"),msg=$("msg");
const N=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const sg=$("sg");let sel=-1,list=[];
function sug(){const v=N(q.value);sel=-1;if(!v){sg.hidden=true;return}
const sc=p=>N(p.n).split(" ").some(w=>w.startsWith(v))?0:1;
list=pool.filter(p=>N(p.n).includes(v)).sort((a,b)=>sc(a)-sc(b)||a.n.localeCompare(b.n)).slice(0,8);
sg.innerHTML=list.map((p,k)=>`<div data-k="${k}">${p.n}</div>`).join("");sg.hidden=!list.length}
function hl(){[...sg.children].forEach((c,k)=>c.className=k===sel?"on":"")}
q.addEventListener("input",sug);q.addEventListener("blur",()=>sg.hidden=true);
sg.addEventListener("mousedown",e=>{const k=e.target.dataset.k;e.preventDefault();if(k!=null){q.value=list[k].n;sg.hidden=true}});
let G,i,cur,t0,state,hint,total,res,timer,pool=D,cn="",tc,wrong=0,hu=0,hs=[1,2],hc=250;
const GRACE=5,cgv=()=>Math.max(0,1000-hc*hu-50*wrong);
const el=()=>(performance.now()-t0)/1000;
function stats(){$("rd").textContent=`Person ${i+1} / 5 · ${cn}`;$("tot").textContent=`Total: ${total.toLocaleString("en")} / 10,000`}
function reset(){const c=CATS[+$("cat").value];cn=c[0];hs=+$("cat").value===0?[0,1,2]:[1,2];hc=hs.length===3?200:250;pool=D.filter(c[1]);G=pool.slice().sort(()=>Math.random()-.5).slice(0,5);i=-1;total=0;res=[];$("end").hidden=true;$("play").hidden=false}
function start(){reset();next()}
function init(){reset();state="idle";$("st").hidden=false;$("map").innerHTML=base;msg.textContent="Choose a list and press Start. Points begin to drop 5 seconds after the dates and places appear.";$("hints").textContent="";$("nx").hidden=true;$("hint").disabled=$("give").disabled=true;q.disabled=$("go").disabled=true;$("cdw").hidden=true;stats()}
function next(){i++;if(i>4)return finish();cur=G[i];hint=false;hu=0;wrong=0;$("hints").textContent="";hb();state="play";$("st").hidden=true;q.value="";sg.hidden=true;
msg.textContent="Who is this?";$("nx").hidden=true;q.disabled=$("go").disabled=$("hint").disabled=$("give").disabled=false;$("cg").textContent=1000;$("sp").textContent=1000;
draw(cur);$("cdw").hidden=false;$("cd").textContent=GRACE;t0=performance.now();clearInterval(timer);timer=setInterval(tick,10);tick();stats();
if(!matchMedia("(pointer:coarse)").matches)q.focus()}
function hb(){$("hint").textContent=`Hint (−${hc}) · ${hs.length-hu} left`}
function tick(){if(state!=="play")return;const e=el();if(e<GRACE)$("cd").textContent=Math.ceil(GRACE-e);else $("cdw").hidden=true;$("sp").textContent=Math.floor(sp(e))}
function fin(p,t){state="done";clearInterval(timer);$("cdw").hidden=true;total+=p;res.push([cur.n,p]);msg.textContent=t;
$("nx").hidden=false;$("nx").textContent=i<4?"Next person":"See results";$("hint").disabled=$("give").disabled=true;stats()}
function guess(){sg.hidden=true;if(state!=="play")return;const m=pool.find(p=>N(p.n)===N(q.value));
if(!m){msg.textContent="Pick a name from the list.";return}
if(m!==cur){wrong++;q.value="";$("cg").textContent=cgv();msg.textContent="✗ Not "+m.n+". −50 points (correct guess now worth "+cgv()+")";return}
const s=Math.floor(sp(el())),b=cgv();$("sp").textContent=s;fin(b+s,`✓ Correct! ${cur.n}: ${b} + ${s} speed = ${b+s} points`)}
function finish(){$("play").hidden=true;$("end").hidden=false;
$("end").innerHTML=`<div class="big">${total.toLocaleString("en")} / 10,000</div><table>${res.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table><div class="row"><button id="again">Play again</button><button id="shr" class="s">Share my score</button></div>`;
$("again").onclick=init;$("shr").onclick=()=>shareScore("Where & When?")}
function shareScore(game){const t="Mapzino · "+game+": "+total.toLocaleString("en")+" / 10,000. Can you beat me? https://mapzino.com";
if(navigator.share){navigator.share({text:t}).catch(()=>{})}else{(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{$("shr").textContent="Copied!"},()=>{prompt("Copy your score:",t)})}}

$("go").onclick=guess;q.addEventListener("keydown",e=>{const o=!sg.hidden&&list.length;
if(e.key==="ArrowDown"&&o){e.preventDefault();sel=(sel+1)%list.length;hl()}
else if(e.key==="ArrowUp"&&o){e.preventDefault();sel=(sel+list.length-1)%list.length;hl()}
else if(e.key==="Escape")sg.hidden=true;
else if(e.key==="Enter"){if(o&&sel>=0){q.value=list[sel].n;sg.hidden=true}else guess()}});
$("hint").onclick=()=>{if(state!=="play"||hu>=hs.length)return;hu++;$("hints").textContent="Hints: "+hs.slice(0,hu).map(k=>cur.h[k]).join(" · ");$("cg").textContent=cgv();hb();if(hu>=hs.length)$("hint").disabled=true;msg.textContent="Hint used: correct guess now worth "+cgv()};
$("give").onclick=()=>{if(state==="play")fin(0,"It was "+cur.n+" (0 points)")};
$("nx").onclick=next;addEventListener("resize",()=>{if(cur&&state!=="idle")draw(cur)});$("start").onclick=()=>{reset();next()};
const FB_MAIL="feedback@mapzino.com";
function fbOpen(game,ctx){const body="What happened, or your idea:\n\n\n\n---\nPlease keep the lines below, they help me find the problem.\nGame: "+game+"\n"+ctx+"\nBrowser: "+navigator.userAgent;
location.href="mailto:"+FB_MAIL+"?subject="+encodeURIComponent("Mapzino feedback: "+game)+"&body="+encodeURIComponent(body)}
$("fb2").onclick=e=>{e.preventDefault();$("fb").onclick(e)};$("fb").onclick=e=>{e.preventDefault();fbOpen("Where & When? (history)","Person: "+(cur?cur.n:"none yet")+"\nList: "+cn+"\nRound: "+(i+1)+" of 5")};
const TH=[["auto","Auto (system)"],["light","Light"],["dark","Dark"],["parchment","Parchment"],["rose","Rose"],["forest","Forest"],["sunset","Sunset"],["neon","Neon"],["mono","Mono"]];
$("theme").innerHTML=TH.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join("");
function setTh(v){if(v==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.dataset.theme=v;$("theme").value=v}
$("theme").onchange=e=>{setTh(e.target.value);try{localStorage.setItem("th",e.target.value)}catch(x){}};
try{const v=localStorage.getItem("th");if(v&&TH.some(t=>t[0]===v))setTh(v)}catch(x){}
init();
</script></body></html>
