const NEAR=1; // 1 = a wrong guess within 200 km gets a friendly message instead of a penalty (cities, landmarks)
function guess(){sg.hidden=true;if(state!=="play")return;const m=(E.find(e=>N(e.n)===N(q.value))||{}).it;
if(!m){msg.textContent="Pick a landmark from the list.";return}
if(m!==cur.m&&(NEAR||!cur.tw.includes(m))){q.value="";
if(NEAR&&dist(m,cur.m)<200){msg.textContent="📍 You are really close! No points lost, try again.";return}
wrong++;$("cg").textContent=cgv();msg.textContent="✗ Not "+m.n+". −50 points (correct guess now worth "+cgv()+")";return}
const s=Math.floor(sp(el())),b=cgv();$("sp").textContent=s;fin(b+s,`✓ Correct! ${m!==cur.m?m.n+" counts too (arrows were drawn from "+cur.m.n+"): ":cur.m.n+": "}${b} + ${s} speed = ${b+s} points`)}
function finish(){$("play").hidden=true;$("end").hidden=false;
$("end").innerHTML=`<div class="big">${total.toLocaleString("en")} / 10,000</div><table>${res.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table><div class="row"><button id="again">Play again</button><button id="shr" class="s">Share my score</button></div>`;$("again").onclick=init;$("shr").onclick=()=>shareScore("Which Landmark?")}
function shareScore(game){const t="Mapzino · "+game+": "+total.toLocaleString("en")+" / 10,000. Can you beat me? https://mapzino.com";
if(navigator.share){navigator.share({text:t}).catch(()=>{})}else{(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{$("shr").textContent="Copied!"},()=>{prompt("Copy your score:",t)})}}

$("hint").onclick=()=>{if(state!=="play"||hu>=hs.length)return;const h=hs[hu++],add=s=>$("hints").textContent=($("hints").textContent?$("hints").textContent+" · ":"")+s;
if(h==="c")add("Continent: "+CN[cur.m.c]);else if(h==="t")add("Type: "+TY[cur.m.y]);else{ex=true;show();add("extra arrow added")}
$("cg").textContent=cgv();hb();if(hu>=hs.length)$("hint").disabled=true;msg.textContent="Hint used: correct guess now worth "+cgv()};
$("give").onclick=()=>{if(state==="play")fin(0,"It was "+cur.m.n+" (0 points)")};
$("go").onclick=guess;$("nx").onclick=next;$("start").onclick=()=>{reset();next()};
const FB_MAIL="feedback@mapzino.com";
function fbOpen(game,ctx){const body="What happened, or your idea:\n\n\n\n---\nPlease keep the lines below, they help me find the problem.\nGame: "+game+"\n"+ctx+"\nBrowser: "+navigator.userAgent;
location.href="mailto:"+FB_MAIL+"?subject="+encodeURIComponent("Mapzino feedback: "+game)+"&body="+encodeURIComponent(body)}
$("fb2").onclick=e=>{e.preventDefault();$("fb").onclick(e)};$("fb").onclick=e=>{e.preventDefault();fbOpen("Which Landmark?","Mystery landmark: "+(cur?cur.m.n:"none yet")+"\nArrows shown: "+(cur?cur.r.slice(0,-1).map(x=>x.c.n+" "+Math.round(x.b)+"deg").join(", "):"-")+"\nList: "+cn)};
function sug(){const v=N(q.value);sel=-1;if(!v){sg.hidden=true;return}const sc=p=>N(p.n).split(" ").some(w=>w.startsWith(v))?0:1,seen=new Set();
list=E.filter(p=>N(p.n).includes(v)).sort((a,b)=>sc(a)-sc(b)||a.n.localeCompare(b.n)).filter(e=>!seen.has(e.it)&&seen.add(e.it)).slice(0,8);
sg.innerHTML=list.map((p,k)=>`<div data-k="${k}">${p.n}${p.n!==p.it.n?` <small style="opacity:.6">· ${p.it.n}</small>`:""}</div>`).join("");sg.hidden=!list.length}
const hl=()=>[...sg.children].forEach((c,k)=>c.className=k===sel?"on":"");
q.addEventListener("input",sug);q.addEventListener("blur",()=>sg.hidden=true);
sg.addEventListener("mousedown",e=>{const k=e.target.dataset.k;e.preventDefault();if(k!=null){q.value=list[k].n;sg.hidden=true}});
q.addEventListener("keydown",e=>{const o=!sg.hidden&&list.length;
if(e.key==="ArrowDown"&&o){e.preventDefault();sel=(sel+1)%list.length;hl()}
else if(e.key==="ArrowUp"&&o){e.preventDefault();sel=(sel+list.length-1)%list.length;hl()}
else if(e.key==="Escape")sg.hidden=true;
else if(e.key==="Enter"){if(o&&sel>=0){q.value=list[sel].n;sg.hidden=true}else guess()}});
const TH=[["auto","Auto (system)"],["light","Light"],["dark","Dark"],["parchment","Parchment"],["rose","Rose"],["forest","Forest"],["sunset","Sunset"],["neon","Neon"],["mono","Mono"]];
$("theme").innerHTML=TH.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join("");
function setTh(v){if(v==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.dataset.theme=v;$("theme").value=v}
$("theme").onchange=e=>{setTh(e.target.value);try{localStorage.setItem("th",e.target.value)}catch(x){}};
try{const v=localStorage.getItem("th");if(v&&TH.some(t=>t[0]===v))setTh(v)}catch(x){}
init();
</script></body></html>
