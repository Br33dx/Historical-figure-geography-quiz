function topoD(t,skip){const tr=t.transform,k=tr?tr.scale:[1,1],o=tr?tr.translate:[0,0];
const A=t.arcs.map(a=>{let x=0,y=0;return a.map(p=>{if(tr){x+=p[0];y+=p[1]}else{x=p[0];y=p[1]}return[+(x*k[0]+o[0]+180).toFixed(2),+(90-(y*k[1]+o[1])).toFixed(2)]})});
const ring=r=>{let pts=[];r.forEach(i=>{const a=i<0?A[~i].slice().reverse():A[i];pts=pts.concat(pts.length?a.slice(1):a)});let off=0;pts=pts.map((p,j)=>{if(j){const d=p[0]-pts[j-1][0];if(d>180)off-=360;else if(d<-180)off+=360}return[+(p[0]+off).toFixed(2),p[1]]});return"M"+pts.map(p=>p.join(",")).join("L")+"Z"};
const poly=p=>p.map(ring).join("");
return Object.values(t.objects)[0].geometries.filter(g=>!skip.includes(g.id)).map(g=>g.type==="Polygon"?poly(g.arcs):g.type==="MultiPolygon"?g.arcs.map(poly).join(""):"").join("")}

if(d.length<2000)return;
if(usa){const n=d.match(/-?\d+\.?\d*/g).map(Number);let a=1e9,b=-1e9,e=1e9,f=-1e9;for(let i=0;i+1<n.length;i+=2){a=Math.min(a,n[i]);b=Math.max(b,n[i]);e=Math.min(e,n[i+1]);f=Math.max(f,n[i+1])}if(a<40||b>135||e<30||f>75)return}

for(const m of shuf(pool.filter(c=>!c.sp))){const r=build(m);if(r)G.push({m,r:r.r,tw:r.tw});if(G.length===5)break}
const sc=pool.filter(c=>SP[c.n]);if(sc.length&&Math.random()<.05)G[Math.floor(Math.random()*5)]=special(rnd(sc))}
function init(){reset();state="idle";$("st").hidden=false;$("fl").innerHTML="";$("sv").innerHTML="";$("ct").innerHTML="City<br>?";
msg.textContent="Choose a list and press Start. Points begin to drop 5 seconds after the arrows appear.";$("hints").textContent="";$("nx").hidden=true;
$("hint").disabled=$("give").disabled=q.disabled=$("go").disabled=true;stats()}
function next(){i++;if(i>4)return finish();cur=G[i];hu=0;wrong=0;ex=false;state="play";$("st").hidden=true;q.value="";sg.hidden=true;$("hints").textContent="";hb();
$("ct").innerHTML="City<br>?";msg.textContent="Which city is in the middle?";$("nx").hidden=true;q.disabled=$("go").disabled=$("hint").disabled=$("give").disabled=false;
$("cg").textContent=1000;$("sp").textContent=1000;show();t0=performance.now();clearInterval(timer);timer=setInterval(tick,10);stats();if(!matchMedia("(pointer:coarse)").matches)q.focus()}
function tick(){if(state==="play")$("sp").textContent=Math.floor(sp(el()))}
function nmFit(n){const lw=Math.max(...n.split(" ").map(w=>w.length));let k=Math.min(1,7.5/lw);if(n.length>14)k*=.85;k=Math.max(k,.5);return `<span style="font-size:${k.toFixed(2)}em;display:block;overflow-wrap:anywhere">${n}</span>`}
function fin0(p,t){state="done";clearInterval(timer);total+=p;res.push([cur.m.n,p]);msg.textContent=t+(cur.sp?` Surprise round: ${cur.m.n} is surrounded by ${SP[cur.m.n]}!`:"")+(cur.m.a.length>1?" (also accepted: "+cur.m.a.slice(1).join(" / ")+")":"");$("hints").textContent=cur.m.f||"";$("ct").innerHTML=img(cur.m.i)+nmFit(cur.m.n);
$("nx").hidden=false;$("nx").textContent=i<4?"Next":"See results";$("hint").disabled=$("give").disabled=true;stats()}
const NEAR=1; // 1 = a wrong guess within 200 km gets a friendly message instead of a penalty (cities, landmarks)
function guess(){sg.hidden=true;if(state!=="play")return;const m=(E.find(e=>N(e.n)===N(q.value))||{}).it;
if(!m){msg.textContent="Pick a city from the list.";return}
if(m!==cur.m&&(NEAR||!cur.tw.includes(m))){q.value="";
if(NEAR&&dist(m,cur.m)<200){msg.textContent="📍 You are really close! No points lost, try again.";return}
wrong++;$("cg").textContent=cgv();msg.textContent="✗ Not "+m.n+". −50 points (correct guess now worth "+cgv()+")";return}
const s=Math.floor(sp(el())),b=cgv();$("sp").textContent=s;fin(b+s,`✓ Correct! ${m!==cur.m?m.n+" counts too (arrows were drawn from "+cur.m.n+"): ":cur.m.n+": "}${b} + ${s} speed = ${b+s} points`)}
function finish0(){$("play").hidden=true;$("end").hidden=false;
$("end").innerHTML=`<div class="big">${total.toLocaleString("en")} / 10,000</div><table>${res.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table><div class="row"><button id="again">Play again</button><button id="shr" class="s">Share my score</button></div>`;$("again").onclick=init;$("shr").onclick=()=>shareScore("Which City?")}
function shareScore(game){const t="Mapzino · "+game+": "+total.toLocaleString("en")+" / 10,000. Can you beat me? https://mapzino.com";
if(navigator.share){navigator.share({text:t}).catch(()=>{})}else{(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{$("shr").textContent="Copied!"},()=>{prompt("Copy your score:",t)})}}

$("hint").onclick=()=>{if(state!=="play"||hu>=hs.length)return;const h=hs[hu++],add=s=>$("hints").textContent=($("hints").textContent?$("hints").textContent+" · ":"")+s;
if(h==="c")add("Continent: "+CN[cur.m.c]);else if(h==="t")add("Type: "+TY[cur.m.y]);else{ex=true;show();add("extra arrow added")}
$("cg").textContent=cgv();hb();if(hu>=hs.length)$("hint").disabled=true;msg.textContent="Hint used: correct guess now worth "+cgv()};
$("give").onclick=()=>{if(state==="play")fin(0,"It was "+cur.m.n+" (0 points)")};
$("go").onclick=guess;$("nx").onclick=next;$("start").onclick=()=>{reset();next()};
const FB_MAIL="feedback@mapzino.com";
function fbOpen(game,ctx){const body="What happened, or your idea:\n\n\n\n---\nPlease keep the lines below, they help me find the problem.\nGame: "+game+"\n"+ctx+"\nBrowser: "+navigator.userAgent;
location.href="mailto:"+FB_MAIL+"?subject="+encodeURIComponent("Mapzino feedback: "+game)+"&body="+encodeURIComponent(body)}
$("fb2").onclick=e=>{e.preventDefault();$("fb").onclick(e)};$("fb").onclick=e=>{e.preventDefault();fbOpen("Which City?","Mystery city: "+(cur?cur.m.n:"none yet")+"\nArrows shown: "+(cur?cur.r.slice(0,-1).map(x=>x.c.n+" "+Math.round(x.b)+"deg").join(", "):"-")+"\nList: "+cn)};
function sug(){const v=N(q.value);sel=-1;if(!v){sg.hidden=true;return}const sc=p=>N(p.n).split(" ").some(w=>w.startsWith(v))?0:1,seen=new Set();
list=E.filter(p=>N(p.n).includes(v)).sort((a,b)=>sc(a)-sc(b)||a.n.localeCompare(b.n)).filter(e=>!seen.has(e.it)&&seen.add(e.it)).slice(0,8);
sg.innerHTML=list.map((p,k)=>`<div data-k="${k}">${p.n}${p.n!==p.it.n?` <small style="opacity:.6">· ${p.it.n}</small>`:""}</div>`).join("");sg.hidden=!list.length}
const hl=()=>[...sg.children].forEach((c,k)=>c.className=k===sel?"on":"");
q.addEventListener("input",sug);q.addEventListener("blur",()=>sg.hidden=true);
sg.addEventListener("mousedown",e=>{const k=e.target.dataset.k;e.preventDefault();if(k!=null){q.value=list[k].n;sg.hidden=true}});
q.addEventListener("keydown",e=>{const o=!sg.hidden&&list.length;
if(e.key==="ArrowDown"&&o){e.preventDefault();sel=(sel+1)%list.length;hl()}
else if(e.key==="ArrowUp"&&o){e.preventDefault();sel=(sel+list.length-1)%list.length;hl()}
else if(e.key==="Escape")sg.hidden=true;
else if(e.key==="Enter"){if(o&&sel>=0){q.value=list[sel].n;sg.hidden=true}else guess()}});
const TH=[["auto","Auto (system)"],["light","Light"],["dark","Dark"],["parchment","Parchment"],["rose","Rose"],["forest","Forest"],["sunset","Sunset"],["neon","Neon"],["mono","Mono"]];
$("theme").innerHTML=TH.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join("");
function setTh(v){if(v==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.dataset.theme=v;$("theme").value=v}
$("theme").onchange=e=>{setTh(e.target.value);try{localStorage.setItem("th",e.target.value)}catch(x){}};
try{const v=localStorage.getItem("th");if(v&&TH.some(t=>t[0]===v))setTh(v)}catch(x){}
function reset(){if(!MZ.on)return reset0();$("cat").value=0;MZ.seeded(reset0)}
function fin(p,t){fin0(p,t);if(MZ.on)MZ.progress(total,res)}
function finish(){finish0();if(MZ.on)MZ.endUI($("end"),total,res)}
function dailyBoot(){const a=document.querySelector(".back");a.href="daily.html";a.textContent="← Daily challenges";$("cat").hidden=true;
document.querySelector("h1").textContent+=" · Daily";$("start").textContent="Start today's challenge";
msg.textContent="Daily challenge "+MZ.DAY+": everyone gets the same 5 puzzles today. One try. Points begin to drop 5 seconds after each puzzle appears.";
$("start").addEventListener("click",()=>MZ.started());
const sv=MZ.load();if(sv){$("st").hidden=true;total=sv.t;res=sv.r;finish()}}
init();if(MZ.on)dailyBoot();
</script></body></html>
